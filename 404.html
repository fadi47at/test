<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page not found · Fadi's Design Library</title>
  <meta name="description" content="The page you're looking for has wandered off." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="404 — Page not found" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2326251E'/%3E%3Crect x='8' y='8' width='16' height='16' rx='2' fill='%23FCFAF8'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Questrial&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Questrial', system-ui, sans-serif;
      background: #FCFAF8;
      color: #26251E;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .frame {
      max-width: 640px;
      padding: 60px 32px;
      text-align: center;
    }
    .big {
      font-family: 'EB Garamond', serif;
      font-style: italic;
      font-size: clamp(120px, 22vw, 220px);
      font-weight: 400;
      line-height: 0.9;
      color: #B89968;
      margin: 0;
      letter-spacing: -4px;
    }
    h1 {
      font-size: 28px;
      font-weight: 400;
      margin: 0 0 12px;
    }
    p {
      font-family: 'EB Garamond', serif;
      font-style: italic;
      font-size: 18px;
      line-height: 1.5;
      color: #504F49;
      margin: 0 0 36px;
    }
    .links {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .links a {
      display: inline-flex; align-items: center;
      padding: 12px 22px;
      border-radius: 100px;
      font-size: 14px;
      text-decoration: none;
      transition: transform 200ms ease, background 200ms ease, color 200ms ease;
    }
    .links a.primary { background: #26251E; color: #FCFAF8; }
    .links a.primary:hover { background: #3a3933; transform: translateY(-1px); }
    .links a.ghost {
      border: 1px solid #26251E;
      color: #26251E;
    }
    .links a.ghost:hover { background: #26251E; color: #FCFAF8; }

    .back {
      margin-top: 40px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #979696;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="big">404</div>
    <h1>This page wandered off.</h1>
    <p>The link you followed may be broken, or the page may have been moved. Either way, here's where to go next.</p>
    <div class="links">
      <a class="primary" href="./">← Library home</a>
      <a class="ghost" href="./gallery/">Browse 20 designs</a>
      <a class="ghost" href="./vad/">Fadi's services</a>
    </div>
    <div class="back">fadi47at.github.io/test</div>
  </div>
</body>
</html>
